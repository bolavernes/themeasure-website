[build]
  command = "node build.mjs"
  publish = "dist"
  functions = "netlify/functions"

# SITE_URL ist die öffentliche Adresse der Seite, kein Geheimnis: vom Secret-Scan ausnehmen
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "SITE_URL"

[functions]
  node_bundler = "esbuild"


[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
